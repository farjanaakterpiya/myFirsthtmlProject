<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account HTML</title>
</head>
<body>
    <label for="">First name:</label><br>
    <input type="text" name="name" placeholder="Enter your first name"><br>
    <label for="">Last name:</label><br>
    <input type="text" name="name" placeholder="Enter your last name"><br>
    <label for="">Email</label><br>
    <input type="email" name="email" placeholder="Enter your email"><br>
    <label for="">Password:</label><br>
    <input type="password" name="password" placeholder="Enter your password"><br>
    <label for="">Confirm password:</label><br>
    <input type="text" name="confirm password"><br>
    <label for="">Gender:</label> <br>
    <input type="radio" name="male" value="">Male<br>
    <input type="radio" name="female" value="">Female<br>
    <label for="">Hobbies:</label><br>
    <input type="checkbox" name="music" value="">Music
    <input type="checkbox" name="Sports" value="">Sports
    <input type="checkbox" name="travel" value="">Travel
    <input type="checkbox" name="movies" value="">Movies<br>
    <label for="">Source of Income:</label><br>
    <select name="dropdown list" id="">
        <option value="">Employed</option>
        <option value="">Student</option>

    </select><br>
    <label for="">Upload Profile Picture:</label><br>
    <input type="file" name="Upload Profile Picture" placeholder=""><br>
    <label for="">Age:</label><br>
    <input type="number" id="age" placeholder=""><br>
    <label for="">Biography:</label><br>
    <textarea>Biography</textarea><br>
    <label for="">Submit</label>
    <input type="submit" value"">
    





</body>
</html>
