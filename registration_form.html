<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Personal Info</legend>
            <input type="text" name="name" placeholder="Enter name"><br><br>
            <textarea name="address" name="address" placeholder="Enter address"></textarea>
        </fieldset>
        <fieldset>
            <legend>Login Info</legend>
            <input type="email" name="email" placeholder="Enter valid email"><br><br>
            <input type="password"name="password" placeholder="Enter password"><br><br>
            <input type="password" name="password" placeholder="Enter password again"><br><br>
            
        </fieldset>
        <input type="button"name="button" value="BUTTON">
    </form>
</body>
</html>
