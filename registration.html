<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student registration form</title>
</head>
<body>
    <form action="">
                <!--ID-->
    <label for="">ID :</label>
    <input type="text" name="id" value=""><br><br>

                 <!--Name-->

    <label for="">Name :</label>
    <textarea name="" id=""></textarea><br><br>
                <!--Round-->
    <label for="">Round :</label>
    <select name="" id="">
        <option value="">round 1</option>
        <option value="">round 2</option>
        <option value="">round 3</option>
    </select><br><br>

                <!--Gender-->
    <label for="">Gender :</label>
    <input type="radio" name="gender" value="male">Male
    <input type="radio" name="gender" value="female">Female
    <input type="radio" name="gender" value="others">Others<br><br>

                <!--Education-->
    <label for="">Education :</label>
    <input type="checkbox" name="education" value="ssc">SSC
    <input type="checkbox" name="education" value="Hsc">HSC<br><br>

    <input type="submit" name="submit">
    <input type="reset" name="reset">



</form>
    
</body>
</html>
